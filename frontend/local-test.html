<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローカルJWT認証テスト</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .result {
            background-color: #e8f5e9;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <h1>ローカルJWT認証テスト</h1>
    
    <div class="container">
        <h2>ログイン</h2>
        <div>
            <label for="email">メールアドレス:</label>
            <input type="email" id="email" value="employee@example.com">
        </div>
        <div>
            <label for="password">パスワード:</label>
            <input type="password" id="password" value="employee">
        </div>
        <button id="login-btn">ログイン</button>
        <div id="login-result" class="result"></div>
    </div>
    
    <div class="container">
        <h2>トランザクション取得</h2>
        <button id="get-transactions-btn">取引履歴を取得</button>
        <div id="transactions-result" class="result"></div>
    </div>
    
    <div class="container">
        <h2>ポイント送信</h2>
        <div>
            <label for="recipient">受取人:</label>
            <select id="recipient">
                <option value="3">Employee Two</option>
            </select>
        </div>
        <div>
            <label for="amount">ポイント数 (1-3):</label>
            <select id="amount">
                <option value="1">1 ポイント</option>
                <option value="2" selected>2 ポイント</option>
                <option value="3">3 ポイント</option>
            </select>
        </div>
        <div>
            <label for="reason">理由:</label>
            <textarea id="reason" rows="3">テスト送信です</textarea>
        </div>
        <button id="send-transaction-btn">送信</button>
        <div id="transaction-result" class="result"></div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        // ログイン処理
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('login-result');
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'ログインに失敗しました');
                }
                
                localStorage.setItem('token', data.token);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                resultDiv.textContent = `ログイン成功!\nトークン: ${data.token.substring(0, 20)}...\nリフレッシュトークン: ${data.refreshToken.substring(0, 20)}...`;
                resultDiv.classList.remove('error');
            } catch (error) {
                resultDiv.textContent = `エラー: ${error.message}`;
                resultDiv.classList.add('error');
                console.error('Login error:', error);
            }
        });
        
        // 取引履歴取得
        document.getElementById('get-transactions-btn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('transactions-result');
            
            try {
                const token = localStorage.getItem('token');
                
                if (!token) {
                    throw new Error('認証が必要です。先にログインしてください。');
                }
                
                const response = await fetch(`${API_URL}/api/transactions`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                });
                
                if (!response.ok) {
                    throw new Error('取引履歴の取得に失敗しました');
                }
                
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.classList.remove('error');
            } catch (error) {
                resultDiv.textContent = `エラー: ${error.message}`;
                resultDiv.classList.add('error');
                console.error('Get transactions error:', error);
            }
        });
        
        // トランザクション送信
        document.getElementById('send-transaction-btn').addEventListener('click', async () => {
            const recipientId = document.getElementById('recipient').value;
            const amount = parseInt(document.getElementById('amount').value);
            const reason = document.getElementById('reason').value;
            const resultDiv = document.getElementById('transaction-result');
            
            try {
                const token = localStorage.getItem('token');
                
                if (!token) {
                    throw new Error('認証が必要です。先にログインしてください。');
                }
                
                if (!reason || reason.length < 10 || reason.length > 200) {
                    throw new Error('理由は10〜200文字で入力してください');
                }
                
                const response = await fetch(`${API_URL}/api/transactions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ recipientId, amount, reason }),
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'トランザクションの送信に失敗しました');
                }
                
                const data = await response.json();
                resultDiv.textContent = `送信成功!\n${JSON.stringify(data, null, 2)}`;
                resultDiv.classList.remove('error');
            } catch (error) {
                resultDiv.textContent = `エラー: ${error.message}`;
                resultDiv.classList.add('error');
                console.error('Send transaction error:', error);
            }
        });
    </script>
</body>
</html>
